name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated pgTAP cases are up to date
        run: pnpm gen:pgtap:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web export (smoke build)
        run: pnpm --filter mobile export:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    name: Migrations + pgTAP (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version pinned: setup-cli v3 uses the version in pnpm-lock.yaml, same as local dev.
      - uses: supabase/setup-cli@v3
      - run: supabase db start
      - run: supabase test db
      - name: Lint SQL
        run: supabase db lint --level warning
